[project]
name = "insumap-database"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "sqlalchemy==2.1.8",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "PL"]
